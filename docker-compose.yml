services:
  postgres:
    image: postgres:17-alpine
    container_name: blog_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blog_management_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blog_management_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: blog_api
    restart: always
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/blog_management_dev?schema=public"
      PORT: 4000
      NODE_ENV: production
    ports:
      - "4000:4000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_GRAPHQL_URL: "http://localhost:4000/graphql"
    container_name: blog_web
    restart: always
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_GRAPHQL_URL: "http://localhost:4000/graphql"
      INTERNAL_API_URL: "http://api:4000"
    ports:
      - "3000:3000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      - api

volumes:
  postgres_data:
